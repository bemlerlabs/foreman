name: ci
# What a green tick means here: the python suites, the contract suite, the lint and the repo
# hygiene gate all pass, and the recorded job-50 receipt still verifies and still hashes to the
# value stored on chain. Nothing in this file holds a key, deploys anything or touches mainnet.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sandbox stack from the vendored wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install wasmtime cryptography pytest ruff \
            vendor/ephemora_cell-2.2.0-py3-none-any.whl
      - name: Core import smoke
        run: python -c "import sys; sys.path.insert(0,'core'); import foreman_core"
      - name: Python suites (71)
        run: python -m pytest core
      - name: Lint
        run: python -m ruff check core scripts plugin-pack
      - name: Repo hygiene (links, tables, leaks, media budget)
        run: python scripts/check_hygiene.py

  proofs:
    # The claims the README makes, replayed from committed artifacts with no network and no keys.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sandbox stack from the vendored wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install wasmtime cryptography \
            vendor/ephemora_cell-2.2.0-py3-none-any.whl
      - name: Receipt of job 50 still verifies
        run: |
          python - <<'PY'
          import json, sys
          sys.path.insert(0, ".")
          from core.receipts.ephemora_adapter import verify_receipt, receipt_hash
          r = json.load(open("artifacts/receipt_demo_job50.json"))
          assert verify_receipt(r) is True, "receipt does not verify"
          h = receipt_hash(r)
          print("receipt_hash:", h)
          assert h == "e7e1673bd9dc9af05c2c0390340c984cd859ded20ebf72146a4671f0c743250e", h
          PY
      - name: Acceptance gate is fail-closed
        run: |
          python scripts/verify_acceptance.py --deliverable artifacts/deliverable_demo.json

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build contract (wasm)
        run: cargo build --release --target wasm32-unknown-unknown --manifest-path contracts/foreman/Cargo.toml
      - name: Contract suite (55)
        run: cargo test --manifest-path contracts/foreman/Cargo.toml
