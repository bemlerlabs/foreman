[package]
name = "foreman"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "4.1.1"

[dev-dependencies]
near-workspaces = { version = "0.14", optional = true }

[features]
workspaces = ["near-workspaces"]

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
