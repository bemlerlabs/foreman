[package]
name = "foreman"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# near-sdk 5 guard: host targets (cargo test) need the unit-testing feature
# (MockedBlockchain / env::test_utils). Standard pattern from the near-sdk examples.
near-sdk = { version = "5", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
