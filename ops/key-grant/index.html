<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Foreman — Grant key</title>
<style>body{font-family:-apple-system,sans-serif;background:#0b0e14;color:#e6e6e6;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
.card{background:#141a26;border:1px solid #26324a;border-radius:16px;padding:40px;max-width:520px}
h1{font-size:22px;margin:0 0 8px}p{color:#9fb0c8;line-height:1.5}
button{background:#f8d245;color:#111;border:0;border-radius:10px;padding:14px 24px;font-size:16px;font-weight:600;cursor:pointer;margin-top:16px}
#status{margin-top:16px;font-family:monospace;font-size:13px;white-space:pre-wrap}</style></head><body>
<div class="card"><h1>🔑 Grant the Foreman owner key</h1>
<p>Account: <b>bemlerlabs.near</b><br>Key: <code>ed25519:3FQ8s8RSVA4oJPZzv5hoVDKAJe267NvYWCjt44AyHakb</code><br>
Meteor opens a confirmation window — one click, done.</p>
<button id="go">Grant key in Meteor</button><div id="status"></div></div>
<script type="module">
import { setupWalletSelector } from "https://esm.sh/@near-wallet-selector/core@8.9.5?bundle";
import { setupMeteorWallet } from "https://esm.sh/@near-wallet-selector/meteor-wallet@8.9.5?bundle";
const s=document.getElementById('status'), PUB="ed25519:3FQ8s8RSVA4oJPZzv5hoVDKAJe267NvYWCjt44AyHakb";
document.getElementById('go').onclick=async()=>{s.textContent="Opening Meteor…";try{
const selector=await setupWalletSelector({network:"mainnet",modules:[setupMeteorWallet()]});
const meteor=await selector.wallet("meteor-wallet");
const accounts=await meteor.signIn({contractId:"contracthelper",methodNames:[],publicKeys:[PUB]});
s.textContent="✅ Signed in as: "+accounts.map(a=>a.accountId).join(", ")+"\nPlease wait 5s, then the lead runs the on-chain check.";
}catch(e){s.textContent="Error: "+(e?.message||JSON.stringify(e));}};
</script></body></html>
